[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-backend"
version = "0.1.0"
description = "FinGuard AI fraud screening backend service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "joblib>=1.4.0",
    "xgboost>=2.1.0",
    "tensorflow>=2.16.0",
    "python-dotenv>=1.0.1",
    "bcrypt>=4.2.0",
    "pyjwt[crypto]>=2.9.0",
    "boto3>=1.34.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
